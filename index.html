<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Palabritas · Sopa de letras</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #8fd3ff;
        overscroll-behavior: none;
        /* El juego controla los arrastres: no dejes que el navegador los convierta
           en desplazamiento o zoom y cambie el viewport durante un toque. */
        touch-action: none;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        width: 100vw;
        height: 100dvh;
        overflow: hidden;
      }
      #app canvas {
        display: block;
        touch-action: none;
        image-rendering: auto;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
